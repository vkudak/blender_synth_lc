; Налаштування пакетної генерації кривих.
; Запуск: .venv/bin/python scripts/generate_dataset.py --config config/dataset.ini

[blender]
executable = C:\Program Files\Blender Foundation\Blender 4.5\blender.exe

[paths]
models_dir = models
; порожнє = усі придатні моделі з models_dir, окрім skip_models
models =
skip_models = Topex_g.blend, Topex_g3.blend, Topex_g5_spb3.blend 
output_dir = reports/dataset

[run]
seed = 1
; auto | cpu | cuda | optix
device = optix

[observer]
; fixed | random
mode = random
latitude_deg = 48.633
longitude_deg = 22.33
altitude_m = 0

[orbit]
; random | fixed
mode = random
altitude_min_km = 300
altitude_max_km = 3000
altitude_km = 800
inclination_min_deg = 0
inclination_max_deg = 180
inclination_deg = 51.6
raan_deg = 0
phase_deg = 0
align_for_pass = true

[pass]
duration_s = 60
cadence_s = 10
minimum_elevation_deg = 20
max_attempts = 1000

[sun]
; random | vector
mode = random
x = 0.71
y = -0.42
z = 0.56
; Sun irradiance at 1 AU (W/m^2).
energy = 1361
max_eclipse_fraction = 0.15

[noise]
; Reference SNR for normalized flux 1 at zenith.
reference_snr = 50

[render]
resolution = 128
samples = 8
exposure = -8.8
scene_meters_per_unit = 1

[dataset]
; кількість паралельних Blender процесів (1 = послідовно, рекомендується 3-4)
workers = 4
total_curves = 200

[dataset.tumbling]
; Probability of tumbling among all curves, including otherwise static curves.
fraction = 0.01

[dataset.period]
; static | rotating | random
mode = random
spin_period_s = 20
spin_period_min_s = 3
spin_period_max_s = 180
; fixed | random
initial_phase_mode = random
initial_phase_rad = 0
; Applied in random mode. At 0.5, static and rotating curves alternate.
rotating_fraction = 0.5

[dataset.precession]
; Fraction of rotating curves with precession.
fraction = 0.5
; fixed: angle_deg; random: angle_min_deg and angle_max_deg
angle_mode = random
angle_min_deg = 5
angle_max_deg = 30
; fixed: period_s; random: period_min_s and period_max_s
period_mode = random
period_min_s = 20
period_max_s = 180

[dataset.scale]
; fixed: factor; random: min_factor and max_factor
mode = random
min_factor = 1
max_factor = 1.5
