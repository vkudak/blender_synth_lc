; Налаштування однієї кривої блиску.
; Запуск: .venv/bin/python scripts/generate_curve.py --config config/curve.ini

[blender]
executable = /home/vkudak/software/blender-4.5.15-linux-x64/blender

[paths]
model = models/Topex_good.blend
output = reports/topex_lightcurve.csv
models_dir = models
skip_models = Topex_g.blend, Topex_g3.blend

[run]
seed = 42
; auto | cpu | cuda | optix
device = cuda

[observer]
; fixed | random
mode = fixed
latitude_deg = 48.633
longitude_deg = 22.33
altitude_m = 0

[orbit]
; random | fixed
mode = random
altitude_min_km = 300
altitude_max_km = 3000
altitude_km = 800
inclination_min_deg = 0
inclination_max_deg = 180
inclination_deg = 51.6
raan_deg = 0
phase_deg = 0
; для fixed: підібрати фазу так, щоб був видимий проліт
align_for_pass = true

[pass]
duration_s = 60
cadence_s = 2
minimum_elevation_deg = 20
max_attempts = 1000

[attitude]
; static | rotating | random
mode = rotating
spin_period_s = 5
spin_period_min_s = 3
spin_period_max_s = 180
rotating_fraction = 0.5
; fixed | random
initial_phase_mode = fixed
initial_phase_rad = 0
; Відхилення осі обертання від центральної осі конуса; 0 вимикає прецесію.
precession_angle_deg = 15
precession_period_s = 160
precession_phase_deg = 0

[sun]
; random | vector
mode = random
x = 0.71
y = -0.42
z = 0.56
; Sun irradiance at 1 AU (W/m^2).
energy = 1361
max_eclipse_fraction = 0.15

[noise]
; All levels below are in normalized-flux units: the clean curve maximum is 1.0.
; Reference SNR for normalized flux 1 at zenith (sets the shot-noise sigma).
reference_snr = 50
; Constant detector bias/dark level added to every sample. 0 disables.
bias_level = 0.01
; Gaussian readout noise 1-sigma per sample, independent of signal. 0 disables.
readout_noise_std = 0.005
; Frame-to-frame correlated noise 1-sigma (AR(1) process). 0 disables.
correlated_noise_std = 0.003
; Correlation time constant (s) of the AR(1) component: the lag over which the
; correlated noise decays by factor e. Must be > 0 when correlated_noise_std > 0.
correlation_time_s = 5
; Saturation (full-well) level: measured flux is clipped to this value before
; quantization. 0 disables clipping; when adc_bits > 0 it is the ADC full scale.
saturation_level = 1.05
; ADC bit depth: the measured flux is rounded to 2^adc_bits - 1 evenly spaced
; levels on [0, saturation_level]. 0 disables quantization (12-16 are typical
; for CCD/CMOS detectors).
adc_bits = 12

[render]
resolution = 320
samples = 8
exposure = -8.8
scene_meters_per_unit = 1
; Порожньо = запускати render_lightcurve.py напряму; інакше зберегти Blender-скрипт запуску.
script_output = reports/topex_lightcurve_test.py
