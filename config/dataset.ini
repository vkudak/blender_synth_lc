; Налаштування пакетної генерації кривих.
; Запуск: .venv/bin/python scripts/generate_dataset.py --config config/dataset.ini

[blender]
executable = /home/vkudak/software/blender-4.5.15-linux-x64/blender

[paths]
models_dir = models
; порожнє = усі придатні моделі з models_dir, окрім skip_models
models =
skip_models = Topex_g.blend, Topex_g3.blend
output_dir = reports/dataset

[run]
seed = 1
; auto | cpu | cuda | optix
device = cuda

[observer]
; fixed | random
mode = random
latitude_deg = 48.633
longitude_deg = 22.33
altitude_m = 0

[orbit]
; random | fixed
mode = random
altitude_min_km = 300
altitude_max_km = 3000
altitude_km = 800
inclination_min_deg = 0
inclination_max_deg = 180
inclination_deg = 51.6
raan_deg = 0
phase_deg = 0
align_for_pass = true

[pass]
duration_s = 60
cadence_s = 10
minimum_elevation_deg = 20
max_attempts = 1000

[attitude]
; static | rotating | random
mode = random
spin_period_s = 20
spin_period_min_s = 3
spin_period_max_s = 180
; fixed | random
initial_phase_mode = random
initial_phase_rad = 0
; Відхилення осі обертання від центральної осі конуса; 0 вимикає прецесію.
precession_angle_deg = 0
precession_period_s = 60
precession_phase_deg = 0

[sun]
; random | vector
mode = random
x = 0.71
y = -0.42
z = 0.56
; Sun irradiance at 1 AU (W/m^2).
energy = 1361
max_eclipse_fraction = 0.15

[render]
resolution = 128
samples = 8
exposure = -8.8
scene_meters_per_unit = 1

[dataset]
total_curves = 10000
; частка кривих, що обертаються, при attitude.mode = random
rotating_fraction = 0.5
; Fraction of rotating curves with precession.
precession_fraction = 0.5
; Випадкова півширина конуса прецесії та її період для кривих з обертанням.
precession_angle_min_deg = 5
precession_angle_max_deg = 30
precession_period_min_s = 20
precession_period_max_s = 180
