; Налаштування пакетної генерації кривих.
; Запуск: .venv/bin/python scripts/generate_dataset.py --config config/dataset.ini

[blender]
executable = /home/vkudak/software/blender-4.5.15-linux-x64/blender

[paths]
models_dir = models
; порожнє = усі придатні моделі з models_dir, окрім skip_models
models =
skip_models = Topex_g.blend, Topex_g3.blend
output_dir = reports/dataset

[run]
seed = 1
; auto | cpu | cuda | optix
device = cuda

[observer]
; fixed | random
mode = random
latitude_deg = 48.633
longitude_deg = 22.33
altitude_m = 0

[orbit]
; random | fixed
mode = random
altitude_min_km = 300
altitude_max_km = 3000
altitude_km = 800
inclination_min_deg = 0
inclination_max_deg = 180
inclination_deg = 51.6
raan_deg = 0
phase_deg = 0
align_for_pass = true

[pass]
duration_s = 60
cadence_s = 10
minimum_elevation_deg = 20
max_attempts = 1000

[sun]
; random | vector
mode = random
x = 0.71
y = -0.42
z = 0.56
; Sun irradiance at 1 AU (W/m^2).
energy = 1361
max_eclipse_fraction = 0.15

[noise]
; All levels below are in normalized-flux units: the clean curve maximum is 1.0.
; Reference SNR for normalized flux 1 at zenith (sets the shot-noise sigma).
reference_snr = 50
; Constant detector bias/dark level added to every sample. 0 disables.
bias_level = 0.01
; Gaussian readout noise 1-sigma per sample, independent of signal. 0 disables.
readout_noise_std = 0.005
; Frame-to-frame correlated noise 1-sigma (AR(1) process). 0 disables.
correlated_noise_std = 0.003
; Correlation time constant (s) of the AR(1) component: the lag over which the
; correlated noise decays by factor e. Must be > 0 when correlated_noise_std > 0.
correlation_time_s = 5
; Saturation (full-well) level: measured flux is clipped to this value before
; quantization. 0 disables clipping; when adc_bits > 0 it is the ADC full scale.
saturation_level = 1.05
; ADC bit depth: the measured flux is rounded to 2^adc_bits - 1 evenly spaced
; levels on [0, saturation_level]. 0 disables quantization (12-16 are typical
; for CCD/CMOS detectors).
adc_bits = 12

[sensor]
; Photometric filter approximation: flux per pixel is w_R*R + w_G*G + w_B*B.
; none | luminance | johnson_b | johnson_v | johnson_r | custom
; none = plain R + G + B sum (previous behavior). After curve normalization
; only the weight ratios matter. RGB-based responses are approximate because
; materials carry RGB albedos, not reflectance spectra.
filter_type = none
; Required only for filter_type = custom: three comma-separated non-negative
; weights with a positive sum (normalized automatically to sum 1).
; rgb_weights = 0.2126, 0.7152, 0.0722

[render]
resolution = 128
samples = 8
exposure = -8.8
scene_meters_per_unit = 1

[dataset]
total_curves = 10000
; кількість паралельних Blender процесів (1 = послідовно, рекомендується 3-4)
workers = 1

[dataset.tumbling]
; Probability of tumbling among all curves, including otherwise static curves.
fraction = 0.01

[dataset.period]
; static | rotating | random
mode = random
spin_period_s = 20
spin_period_min_s = 3
spin_period_max_s = 180
; fixed | random
initial_phase_mode = random
initial_phase_rad = 0
; Applied in random mode. At 0.5, static and rotating curves alternate.
rotating_fraction = 0.5

[dataset.precession]
; Fraction of rotating curves with precession.
fraction = 0.5
; fixed: angle_deg; random: angle_min_deg and angle_max_deg
angle_mode = random
angle_min_deg = 5
angle_max_deg = 30
; fixed: period_s; random: period_min_s and period_max_s
period_mode = random
period_min_s = 20
period_max_s = 180

[dataset.scale]
; fixed: factor; random: min_factor and max_factor
mode = random
min_factor = 1
max_factor = 1.5
