; Налаштування однієї кривої блиску.
; Запуск: .venv/bin/python scripts/generate_curve.py --config config/curve.ini

[blender]
executable = /home/vkudak/software/blender-4.5.15-linux-x64/blender

[paths]
model = models/Lotos_model.blend
output = reports/lotos_lightcurve.csv
models_dir = models
skip_models = Topex_g.blend, Topex_g3.blend

[run]
seed = 42
; auto | cpu | cuda | optix
device = cuda

[observer]
; fixed | random
mode = fixed
latitude_deg = 48.633
longitude_deg = 22.33
altitude_m = 0

[orbit]
; random | fixed
mode = random
altitude_min_km = 300
altitude_max_km = 3000
altitude_km = 800
inclination_min_deg = 0
inclination_max_deg = 180
inclination_deg = 51.6
raan_deg = 0
phase_deg = 0
; для fixed: підібрати фазу так, щоб був видимий проліт
align_for_pass = true

[pass]
duration_s = 60
cadence_s = 10
minimum_elevation_deg = 20
max_attempts = 1000

[attitude]
; static | rotating | random
mode = rotating
spin_period_s = 20
spin_period_min_s = 3
spin_period_max_s = 180
rotating_fraction = 0.5
; fixed | random
initial_phase_mode = fixed
initial_phase_rad = 0
; Відхилення осі обертання від центральної осі конуса; 0 вимикає прецесію.
precession_angle_deg = 0
precession_period_s = 60
precession_phase_deg = 0

[sun]
; random | vector
mode = random
x = 0.71
y = -0.42
z = 0.56
; Sun irradiance at 1 AU (W/m^2).
energy = 1361
max_eclipse_fraction = 0.15

[noise]
; Reference SNR for normalized flux 1 at zenith.
reference_snr = 50

[render]
resolution = 128
samples = 8
exposure = -8.8
; Один Blender unit відповідає 1 м; модель зберігається біля локального нуля для точності.
scene_meters_per_unit = 1
; Порожньо = запускати renderer напряму; інакше зберегти його код у вказаний файл.
script_output =